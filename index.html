<style>
:root{--bg:#031a10;--panel:#07301e;--em:#34d399;--gold:#f7c948;--text:#e7f4ed;--muted:#a9c2b4;--line:rgba(52,211,153,.3)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--text);font-family:"Noto Sans Bengali","Segoe UI",sans-serif;line-height:1.7;background:linear-gradient(180deg,#03140c,#062719 45%,#031a10);overflow-x:hidden}
button,select,input{font:inherit}
header{text-align:center;padding:24px 16px;background:#02110a;border-bottom:2px solid var(--em)}
.logo{color:var(--em);font-weight:800;font-size:clamp(22px,5vw,34px);line-height:1.4}
.sub{color:var(--muted);font-size:clamp(12px,2.5vw,15px);margin-top:6px}
nav{position:sticky;top:0;z-index:20;display:flex;justify-content:center;gap:8px;padding:10px;background:rgba(4,30,18,.96);border-bottom:1px solid var(--line)}
.nav-btn{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:#0a3524;color:var(--text);font-weight:700;font-size:14px;cursor:pointer}
.nav-btn.active{background:var(--em);color:#032014;border-color:var(--em)}
.container{width:min(100% - 24px,960px);margin:22px auto}
.tab{display:none}.tab.active{display:block}
